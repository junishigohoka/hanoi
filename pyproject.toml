[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hanoi"                 # this is what pip install hanoi will use
version = "0.1.0"
description = "Heritable Additive NOIse"
readme = "README.md"
authors = [{ name = "Jun Ishigohoka", email = "jun.ishigohoka@tuebingen.mpg.de" }]
license = { text = "MIT" }
dependencies = [
        "numpy>=2.0",
        "scipy>1.15",
]

[tool.setuptools.packages.find]
where = ["."]
